<!DOCTYPE html>

    <title>Eco do Sertão | Banda Sertaneja</title>
    <!-- Font Awesome para Ícones Modernos -->

    <style>
        :root {
            --primary: #d4af37; /* Dourado */
            --dark-bg: #121212; /* Preto Fosco */
            --card-bg: rgba(30, 30, 30, 0.75); /* Fundo Semitransparente */
            --text-light: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

            background-position: center;
            filter: brightness(0.3) blur(2px);
            z-index: -1;
        }

        /* Card Principal */
        .container {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* Logo / Ícone de Destaque */
        .logo-area {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        /* Títulos e Textos */
        h3 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Botão / Link Moderno */
        .btn-modern {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8414 100%);
            color: #000;
            text-decoration: none;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 50px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .btn-modern:hover {
            background: linear-gradient(135deg, #aa8414 0%, #d4af37 100%);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.6);
            transform: scale(1.02);
        }

        /* Rodapé de Redes Sociais fictício para complementar o visual */
        .social-icons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: var(--primary);
        }

        /* Animação */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ícone Temático (Chapéu/Violão estilizado pela música) -->
        <div class="logo-area">
            <i class="fa-solid fa-guitar"></i>
        </div>
        
        <h3>Eco do Sertão</h3>
        <p>Olá, você está em casa! Entre e conheça nossa história, agenda e modas de viola.</p>
        
        <!-- Link solicitado mantendo a rota original -->
        <a href="/sobre" class="btn-modern">
            <span>Ir para sobre</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>

        <!-- Extras para estética moderna -->
        <div class="social-icons">
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-spotify"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </div>

</body>
</html>
